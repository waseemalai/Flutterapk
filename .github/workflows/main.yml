name: Extract Zip to Root

on:
  push:
    paths:
      - 'keyboard_app.zip'   # jab bhi koi zip push ho
  workflow_dispatch:  # manual run

jobs:
  unzip:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract all zip files to root
        run: |
          for zip in $(find . -maxdepth 1 -name "*.zip"); do
            echo "Extracting $zip to root..."
            unzip -o "$zip"
          done

      - name: Show extracted files
        run: ls -la
